<div id="intro">
<style>
#intro{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.netflix-logo{display:flex;gap:4px;transform:scale(1);animation:netflixZoom 4s ease-in-out forwards}
.netflix-logo span{
  font-family:Impact,Arial Black; font-size:72px; font-weight:900;
  color:#e50914;
  display:inline-block;
  opacity:0;
  transform:translateY(120px) scaleY(0) scaleX(0.8);
  animation: netflixLetter 0.7s forwards;
  text-shadow:0 0 0 transparent;
}
@keyframes netflixLetter{
  0%{opacity:0;transform:translateY(120px) scaleY(0) scaleX(0.8)}
  40%{opacity:1;transform:translateY(-10px) scaleY(1.2) scaleX(1)}
  60%{transform:translateY(5px) scaleY(0.9)}
  80%{transform:translateY(0) scaleY(1.05);text-shadow:0 0 40px #e50914,0 0 80px #e50914}
  100%{opacity:1;transform:translateY(0) scaleY(1);text-shadow:0 0 20px rgba(229,9,20,.8)}
}
@keyframes netflixZoom{
  0%{transform:scale(0.6);letter-spacing:40px}
  20%{transform:scale(1.1);letter-spacing:2px}
  70%{transform:scale(1);letter-spacing:2px}
  100%{transform:scale(3);opacity:0;letter-spacing:10px}
}
/* delays pour défiler */
.netflix-logo span:nth-child(1){animation-delay:0.2s}
.netflix-logo span:nth-child(2){animation-delay:0.3s}
.netflix-logo span:nth-child(3){animation-delay:0.4s}
.netflix-logo span:nth-child(4){animation-delay:0.5s}
.netflix-logo span:nth-child(5){animation-delay:0.6s}
.netflix-logo span:nth-child(6){animation-delay:0.7s}
.netflix-logo span:nth-child(7){animation-delay:0.8s}
.netflix-logo span:nth-child(8){animation-delay:0.9s}
.netflix-logo span:nth-child(9){animation-delay:1s}
.netflix-logo span:nth-child(10){animation-delay:1.1s}

#intro.fadeOut{animation:hide 0.5s 3.5s forwards}
@keyframes hide{to{opacity:0;visibility:hidden}}
@media(max-width:600px){.netflix-logo span{font-size:38px}}
</style>
<div class="netflix-logo">
<span>M</span><span>A</span><span>D</span><span>A
