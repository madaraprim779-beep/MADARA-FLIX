<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADARAFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}
#intro{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mf{font-family:Impact;font-size:86px;font-weight:900;letter-spacing:-3px;display:flex;opacity:0;transform:scale(.8);animation:mf .8s .2s forwards}.mf b:last-child{color:#e50914}@keyframes mf{to{opacity:1;transform:scale(1)}} #intro.out{animation:out .8s 2.5s forwards}@keyframes out{to{opacity:0;visibility:hidden}}
.top{position:sticky;top:0;z-index:20;background:#000;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#e50914;font-weight:900;font-size:32px;font-family:Arial Black} .topR{display:flex;gap:14px;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 14px} .chips::-webkit-scrollbar{display:none}
.chip{padding:9px 16px;border-radius:20px;background:#222;border:1px solid #333;color:#fff;font-size:14px;white-space:nowrap;font-weight:500} .chip.active{background:#fff;color:#000;border-color:#fff}
.hero{margin:0 12px;border-radius:10px;overflow:hidden;position:relative;height:58vw;max-height:380px;background:#111} .hero img{width:100%;height:100%;object-fit:cover} .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000 30%,transparent 70%)}
.heroB{position:absolute;bottom:10px;left:10px;right:10px;z-index:2}
.btnW{width:100%;background:#fff;color:#000;border:none;border-radius:6px;padding:13px;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.btnG{width:100%;background:rgba(120,120,120,.45);color:#fff;border:none;border-radius:6px;padding:12px;font-weight:700;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.sec{margin-top:22px;padding-left:12px} .secT{font-weight:700;font-size:17px;margin-bottom:10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-right:12px} .row::-webkit-scrollbar{display:none}
.card{width:112px;min-width:112px;height:162px;border-radius:5px;overflow:hidden;background:#111;flex-shrink:0;position:relative}
.card img{width:100%;height:100%;object-fit:cover}
.card.wide{width:145px;min-width:145px;height:84px;border-radius:6px}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1.5px solid #fff}
.infoB{position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;display:flex;justify-content:space-around;padding:8px 0}
.progress{position:absolute;bottom:28px;left:0;right:0;height:3px;background:#555} .progress i{display:block;height:100%;background:#e50914}
.bottom{position:fixed;bottom:12px;left:10px;right:10px;background:#232323;border-radius:28px;display:flex;justify-content:space-around;padding:8px 2px;z-index:30}
.b{flex:1;text-align:center;opacity:.6;font-size:10px} .b.active{opacity:1} .b div:first-child{font-size:22px} .b img{width:26px;height:26px;border-radius:50%}
#profiles{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}
#app{display:none;padding-bottom:90px}
#detail{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow-y:auto;padding-bottom:100px}
</style>
</head>
<body>

<div id="intro"><div class="mf"><b>M</b><b>F</b></div><div style="margin-top:10px;letter-spacing:3px;font-weight:900;font-size:18px">MADARA <span style="color:#e50914">FLIX</span></div></div>

<div id="profiles"><div style="text-align:center"><div style="background:#222;padding:6px 12px;border-radius:8px;display:inline-block">👍 Parmi les plus aimés</div><h3 style="margin-top:14px">Choisissez votre profil</h3><div style="display:grid;grid-template-columns:repeat(3,90px);gap:14px;margin-top:18px"><div onclick="enterApp()"><img src="https://i.pravatar.cc/200?img=11" style="width:90px;height:90px;border-radius:14px;object-fit:cover"><div style="font-size:13px;margin-top:6px">Madara225</div></div><div onclick="enterApp()"><img src="https://i.pravatar.cc/200?img=5" style="width:90px;height:90px;border-radius:14px"><div style="font-size:13px;margin-top:6px">Minata</div></div><div onclick="enterApp()"><img src="https://i.pravatar.cc/200?img=8" style="width:90px;height:90px;border-radius:14px"><div style="font-size:13px;margin-top:6px">Jedel</div></div></div></div></div>

<div id="app">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo">N</div><b>Accueil</b></div><div class="topR">⬇ 🔔 <span style="background:#e50914;border-radius:50%;padding:2px 6px;font-size:12px">7</span></div></div>
<div class="chips"><div class="chip active">Séries</div><div class="chip">Films</div><div class="chip">Jeux</div><div class="chip">Halloween</div><div class="chip">Tout</div></div>
<div class="hero" id="hero"></div>
<div id="sections"></div>
<div class="bottom"><div class="b active"><div>⌂</div>Accueil</div><div class="b"><div>◫</div>Extraits</div><div class="b"><div>⌕</div>Rechercher</div><div class="b active"><img src="https://i.pravatar.cc/100?img=11"><div>Mon Netflix</div></div></div>
</div>

<div id="detail"></div>

<script>
const TMDB_KEY="4d915c255bcab0ffd0b07dd2a63f3387";
const W500="https://image.tmdb.org/t/p/w500", ORIG="https://image.tmdb.org/t/p/original";
let ALL=[];

async function fetchShow(q){
 const r=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=fr-FR`); const j=await r.json(); const m=j.results?.[0]; if(!m) return null;
 let seasons=[]; if(m.media_type==='tv'||m.first_air_date){try{const tv=await fetch(`https://api.themoviedb.org/3/tv/${m.id}?api_key=${TMDB_KEY}&language=fr-FR`).then(r=>r.json()); for(let s=1;s<=tv.number_of_seasons;s++){const sd=await fetch(`https://api.themoviedb.org/3/tv/${m.id}/season/${s}?api_key=${TMDB_KEY}&language=fr-FR`).then(r=>r.json()).catch(()=>null); if(sd?.episodes) seasons.push({num:s,name:sd.name||`Saison ${s}`,eps:sd.episodes})}}catch{}}
 return {id:m.id,title:m.title||m.name,poster:m.poster_path?W500+m.poster_path:'',backdrop:m.backdrop_path?ORIG+m.backdrop_path:W500+m.poster_path,overview:m.overview||'',seasons}
}
async function load(){
 const LIST=["Jujutsu Kaisen","Mentalist","S.W.A.T.","The Rookie","Young Sheldon","Beauty in Black","Stranger Things","One Piece","Naruto","Demon Slayer"];
 for(let t of LIST){const m=await fetchShow(t); if(m){ALL.push(m); if(ALL.length>2) render()}} render();
}
function render(){
 if(!ALL.length) return;
 const h=ALL[0]; document.getElementById('hero').innerHTML=`<img src="${h.backdrop}"><div class="heroB"><button class="btnW" onclick="openD('${h.title.replace(/'/g,"")}')">▶ Regarder le film</button><button class="btnG"><span style="font-size:20px">+</span> Ma liste</button></div>`;
 const cats=[
  ["Reprendre avec le profil de Madara225",[ALL[0]],true],
  ["Séries policières",ALL.slice(1,5),false],
  ["Les séries regardées en boucle",ALL.slice(5,9),false]
 ];
 document.getElementById('sections').innerHTML=cats.map(([title,arr,isResume])=>`
  <div class="sec"><div class="secT">${title}</div><div class="row">
  ${arr.map(m=>isResume?`
    <div style="width:145px;min-width:145px;background:#1a1a1a;border-radius:6px;overflow:hidden;position:relative" onclick="openD('${m.title.replace(/'/g,"")}')">
      <div style="height:84px;position:relative"><img src="${m.backdrop}" style="width:100%;height:100%;object-fit:cover"><div class="play">▶</div></div>
      <div class="progress"><i style="width:45%"></i></div>
      <div class="infoB"><span style="border:1.5px solid #fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center">i</span><span>⋮</span></div>
      <div style="font-size:11px;padding:8px 6px 32px">Jujutsu Kaisen<br><span style="opacity:.6;font-size:10px">THE CULLING GAME Part 1</span></div>
    </div>
  `:`
    <div class="card" onclick="openD('${m.title.replace(/'/g,"")}')"><img src="${m.poster}"></div>
  `).join('')}
  </div></div>`).join('');
}
function openD(title){
 const m=ALL.find(x=>x.title===title); if(!m) return;
 let html=`<div style="height:60vh;background:url('${m.backdrop}') center/cover;position:relative"><button onclick="document.getElementById('detail').style.display='none'" style="position:absolute;top:12px;left:12px;background:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:800">✕</button><div style="position:absolute;inset:0;background:linear-gradient(to top,#000 30%,transparent)"></div></div><div style="padding:14px"><h2>${m.title}</h2><p style="opacity:.7;font-size:13px;margin-top:6px">${m.overview.slice(0,180)}</p>`;
 if(m.seasons.length){html+=`<div style="display:flex;gap:8px;overflow-x:auto;margin-top:14px">`+m.seasons.map((s,i)=>`<button style="background:${i==0?'#fff':'#222'};color:${i==0?'#000':'#fff'};border:none;padding:8px 14px;border-radius:20px;font-weight:700" onclick="showS(${i},'${m.title.replace(/'/g,"")}')">${s.name}</button>`).join('')+`</div><div id="eps"></div>`}
 html+=`</div>`; document.getElementById('detail').innerHTML=html; document.getElementById('detail').style.display='block'; if(m.seasons.length) showS(0,m.title);
}
function showS(idx,title){const m=ALL.find(x=>x.title===title); const s=m.seasons[idx]; document.getElementById('eps').innerHTML=s.eps.map(ep=>`<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #222"><div style="opacity:.5;font-weight:800">${ep.episode_number}</div><img src="${ep.still_path?W500+ep.still_path:m.backdrop}" style="width:110px;height:62px;border-radius:6px;object-fit:cover"><div style="flex:1"><div style="font-size:13px;font-weight:700">${ep.name||'Episode '+ep.episode_number}</div><div style="font-size:11px;opacity:.5">${ep.overview?.slice(0,70)||''}</div></div></div>`).join('')}

function enterApp(){document.getElementById('profiles').style.display='none'; document.getElementById('app').style.display='block'; load()}
setTimeout(()=>{document.getElementById('intro').classList.add('out'); setTimeout(()=>document.getElementById('intro').style.display='none',800)},2500);
</script>
</body>
</html>
