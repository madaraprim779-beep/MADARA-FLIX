<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MADARAFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;-webkit-font-smoothing:antialiased}

/* INTRO MF COMME TA VIDEO */
#intro{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mf-logo{font-family:Impact,Arial Black;font-weight:900;font-size:86px;letter-spacing:-3px;display:flex;opacity:0;transform:scale(.85);animation:mfIn .8s .2s forwards}
.mf-logo b:first-child{color:#fff} .mf-logo b:last-child{color:#e50914}
@keyframes mfIn{to{opacity:1;transform:scale(1)}}
.mf-line{position:absolute;top:52%;left:-15%;width:130%;height:2px;background:linear-gradient(90deg,transparent,#e50914,transparent);transform:rotate(-14deg) translateX(-100%);animation:line 1.1s .1s forwards}
@keyframes line{to{transform:rotate(-14deg) translateX(100%);opacity:0}}
.mf-sub{margin-top:14px;text-align:center;opacity:0;animation:sub .6s .9s forwards}@keyframes sub{to{opacity:1}}
.mf-sub h2{font-size:20px;letter-spacing:3px;font-weight:900} .mf-sub h2 .r{color:#e50914}
.mf-sub p{font-size:9px;letter-spacing:4px;opacity:.55;margin-top:6px}
#intro.out{animation:out .8s 2.6s forwards}@keyframes out{to{opacity:0;transform:scale(1.15);filter:blur(15px);visibility:hidden}}

/* PROFIL SCREEN COMME PHOTO 1 */
#profiles{position:fixed;inset:0;background:#000;z-index:90000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.p-hero{width:100%;height:58vh;background-size:cover;background-position:center;position:absolute;top:0;left:0;opacity:.7}
.p-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 20%,#000 95%)}
.p-content{position:relative;z-index:2;width:100%;max-width:380px;text-align:center}
.p-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:6px;font-size:13px;margin-top:55vh}
.p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.p-item{text-align:center;cursor:pointer}
.p-icon{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#222;border:2px solid transparent}
.p-icon img{width:100%;height:100%;object-fit:cover}
.p-item.active .p-icon{border-color:#fff}
.p-name{font-size:13px;margin-top:8px;opacity:.9}
.p-edit{width:100%;aspect-ratio:1;border-radius:14px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:26px}

/* NETFLIX HOME COMME PHOTOS 2-3-4 */
#app{display:none;min-height:100vh;background:#000;padding-bottom:90px}
.n-top{position:sticky;top:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.n-logo{color:#e50914;font-weight:900;font-size:36px;line-height:1}
.n-nav{display:flex;align-items:center;gap:18px;font-weight:700}
.n-nav .active{border-bottom:3px solid #fff;padding-bottom:4px}
.n-icons{display:flex;gap:16px;font-size:20px}
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px}
.cat-chips::-webkit-scrollbar{display:none}
.chip{border:1px solid #444;padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;background:#1a1a1a}
.chip.active{background:#fff;color:#000;border-color:#fff}
.hero-big{margin:0 14px;border-radius:10px;overflow:hidden;position:relative;height:62vw;max-height:420px;background:#111}
.hero-big img{width:100%;height:100%;object-fit:cover}
.hero-big::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000 15%,transparent 55%)}
.hero-actions{position:absolute;bottom:12px;left:12px;right:12px;z-index:2}
.btn-white{background:#fff;color:#000;width:100%;padding:14px;border:none;border-radius:6px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-grey{background:rgba(255,255,255,.2);color:#fff;width:100%;padding:12px;border:none;border-radius:6px;font-weight:700;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.sec{padding:0 0 0 14px;margin-top:22px}
.sec-title{font-weight:700;font-size:17px;margin-bottom:10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-right:14px}
.row::-webkit-scrollbar{display:none}
.card{width:110px;min-width:110px;height:160px;border-radius:6px;overflow:hidden;background:#1a1a1a;position:relative;flex-shrink:0}
.card img{width:100%;height:100%;object-fit:cover;image-rendering:-webkit-optimize-contrast}
.card.big{width:154px;min-width:154px;height:92px}
.progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#444}
.progress i{display:block;height:100%;background:#e50914;width:65%}
.badge-r{position:absolute;bottom:6px;left:6px;background:#e50914;color:#fff;font-size:9px;font-weight:900;padding:3px 6px;border-radius:3px}

/* BOTTOM BAR COMME NETFLIX */
.bottom{position:fixed;bottom:14px;left:14px;right:14px;background:#1f1f1f;border-radius:30px;display:flex;justify-content:space-around;padding:10px 6px;z-index:60}
.b-item{flex:1;text-align:center;opacity:.5;font-size:10px}.b-item.active{opacity:1}
.b-item span{display:block;font-size:22px}
.b-item img{width:26px;height:26px;border-radius:50%}

/* DETAIL */
#detail{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow-y:auto;padding-bottom:100px}
.d-back{height:60vh;background-size:cover;background-position:center top;position:relative}
.d-back::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000 25%,transparent 70%)}
</style>
</head>
<body>

<div id="intro">
<div class="mf-logo"><b>M</b><b>F</b></div>
<div class="mf-line"></div>
<div class="mf-sub"><h2>MADARA <span class="r">FLIX</span></h2><p>TON UNIVERS. SANS LIMITES.</p></div>
</div>

<!-- ECRAN PROFILS -->
<div id="profiles">
<div class="p-hero" id="pHero"></div>
<div class="p-content">
<div class="p-tag">👍 Parmi les plus aimés</div>
<div style="margin-top:18px;font-size:16px;opacity:.9">Choisissez votre profil</div>
<div class="p-grid">
<div class="p-item active" onclick="enterApp('Madara225')"><div class="p-icon"><img src="https://i.pravatar.cc/200?img=11"></div><div class="p-name">Madara225</div></div>
<div class="p-item" onclick="enterApp('Minata')"><div class="p-icon"><img src="https://i.pravatar.cc/200?img=5"></div><div class="p-name">Minata</div></div>
<div class="p-item" onclick="enterApp('Jedel')"><div class="p-icon"><img src="https://i.pravatar.cc/200?img=8"></div><div class="p-name">Jedel</div></div>
<div class="p-item" onclick="enterApp('Madara')"><div class="p-icon" style="background:#123a4a;display:flex;align-items:center;justify-content:center;font-size:32px">☺<span style="position:absolute;bottom:10px;font-size:8px;color:#ff6">jeunesse</span></div><div class="p-name">Madara</div></div>
<div class="p-item" onclick="enterApp('Sylla')"><div class="p-icon"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200"></div><div class="p-name">Sylla</div></div>
<div class="p-item" onclick="enterApp('Edit')"><div class="p-edit">✎</div><div class="p-name">Modifier</div></div>
</div>
</div>
</div>

<!-- APP NETFLIX -->
<div id="app">
<div class="n-top">
<div style="display:flex;align-items:center;gap:12px"><div class="n-logo">N</div><div class="n-nav"><span class="active">Accueil</span></div></div>
<div class="n-icons"><span>⬇</span><span>🔔</span></div>
</div>
<div class="cat-chips"><div class="chip active">Séries</div><div class="chip">Films</div><div class="chip">Jeux</div><div class="chip">Halloween</div><div class="chip">Tout</div></div>
<div class="hero-big" id="heroBig"></div>
<div id="allSections"></div>
<div class="bottom">
<div class="b-item active"><span>⌂</span>Accueil</div>
<div class="b-item"><span>⧉</span>Extraits</div>
<div class="b-item"><span>⌕</span>Rechercher</div>
<div class="b-item active"><img id="bAvatar" src="https://i.pravatar.cc/100?img=11"><div>Mon Netflix</div></div>
</div>
</div>

<div id="detail"></div>

<script>
// API DIRECT DANS LE CODE - QUALITE HD
const TMDB_KEY="4d915c255bcab0ffd0b07dd2a63f3387";
const IMG_ORIGINAL="https://image.tmdb.org/t/p/original";
const IMG_HD="https://image.tmdb.org/t/p/w780";
const IMG_POSTER="https://image.tmdb.org/t/p/w500";

let ALL=[];
const TITLES=["À vie","The Mentalist","S.W.A.T.","The Rookie","Young Sheldon","Tyler Perry Beauty in Black","The Blacklist","Demon Slayer","Kuroko's Basketball","Hunter x Hunter","Jujutsu Kaisen","One Piece","Stranger Things","Wednesday","Squid Game","Lupin","Dark","Vikings","Peaky Blinders","The Witcher","Bridgerton","You","Black Mirror","The Sandman","Naruto","Attack on Titan","Death Note","Solo Leveling","Dune","Inception","Interstellar","Joker","The Batman","Avengers Endgame","Spider-Man","John Wick","Top Gun Maverick","Avatar","The Last of Us","The Boys","House of the Dragon","S.W.A.T.","The Rookie"];

async function fetchOne(q){
 try{
  const r=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=fr-FR`);
  const d=await r.json(); if(!d.results||!d.results[0]) return null;
  const m=d.results[0];
  return {
   title:m.title||m.name,
   poster:m.poster_path?`${IMG_POSTER}${m.poster_path}`:`https://via.placeholder.com/500x750?text=${encodeURIComponent(q)}`,
   backdrop:m.backdrop_path?`${IMG_ORIGINAL}${m.backdrop_path}`:`${IMG_HD}${m.poster_path}`,
   overview:m.overview||""
  }
 }catch(e){return null}
}

async function loadAll(){
 for(let t of TITLES){
  const mv=await fetchOne(t); if(mv) ALL.push(mv);
  if(ALL.length>2) render();
 }
 render();
}

function render(){
 if(ALL.length<1) return;
 document.getElementById('pHero').style.backgroundImage=`url('${ALL[0].backdrop}')`;
 const h=ALL[Math.floor(Math.random()*Math.min(6,ALL.length))];
 document.getElementById('heroBig').innerHTML=`<img src="${h.backdrop}"><div class="hero-actions"><button class="btn-white">▶ Regarder le film</button><button class="btn-grey">+ Ma liste</button></div>`;

 const sections=[
  ["Reprendre avec le profil de Madara225", ALL.slice(0,4), true],
  ["Séries policières", ALL.slice(1,8), false],
  ["Les séries regardées en boucle", ALL.slice(8,14), false],
  ["Anime et titres inspirés de l'animation japonaise", ALL.slice(14,20), false],
  ["Séries à suspense", ALL.slice(20,26), false],
  ["Ma liste", ALL.slice(2,7), false],
  ["Bandes-annonces que vous avez regardées", ALL.slice(26,32), false]
 ];

 document.getElementById('allSections').innerHTML=sections.map(([title,list,isContinue])=>`
  <div class="sec">
   <div class="sec-title">${title}</div>
   <div class="row">
   ${list.map(m=>`
    <div class="card ${isContinue?'big':''}" onclick="openDetail('${m.title}')">
     <img src="${m.poster}" loading="eager">
     ${isContinue?`<div class="progress"><i></i></div>`:`${Math.random()>.7?`<div class="badge-r">Ajout récent</div>`:''}`}
    </div>`).join('')}
   </div>
  </div>
 `).join('');
}

function enterApp(name){
 document.getElementById('profiles').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('bAvatar').src=`https://i.pravatar.cc/100?img=${name==='Madara225'?11:5}`;
 loadAll();
}
function openDetail(t){
 const m=ALL.find(a=>a.title===t); if(!m) return;
 document.getElementById('detail').innerHTML=`
  <div class="d-back" style="background-image:url('${m.backdrop}')"><button onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute;top:16px;left:16px;background:#fff;border:none;padding:8px 12px;border-radius:20px">✕</button></div>
  <div style="padding:16px"><h2 style="font-size:24px">${m.title}</h2><p style="margin-top:10px;opacity:.7;font-size:13px;line-height:1.4">${m.overview.slice(0,220)}</p>
  <button class="btn-white" style="margin-top:16px">▶ Regarder</button></div>`;
 document.getElementById('detail').style.display='block';
}

// INTRO AUTO
setTimeout(()=>document.getElementById('intro').classList.add('out'),2800);
setTimeout(()=>document.getElementById('intro').style.display='none',3600);
</script>
</body>
</html>
