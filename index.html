<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADARA FLIX</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:'Inter',system-ui;overflow-x:hidden}
/* INTRO NETFLIX MF */
#intro{position:fixed;inset:0;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.intro-bg{position:absolute;inset:0;background:radial-gradient(circle at center,#1a0000 0%,#000 70%);opacity:0;animation:bgFade 1s .2s forwards}@keyframes bgFade{to{opacity:1}}
.mf-logo-anim{position:relative;display:flex;font-family:'Bebas Neue',Impact;font-size:150px;letter-spacing:-8px;transform:scale(.6);opacity:0}
.mf-logo-anim.active{animation:mfReveal 2.2s cubic-bezier(.25,.8,.25,1) forwards}
@keyframes mfReveal{0%{transform:scale(.6) translateY(30px);opacity:0;filter:blur(20px) brightness(0)}30%{opacity:1;filter:blur(0) brightness(.6)}70%{transform:scale(1.1);filter:brightness(1.4);text-shadow:0 0 50px #e50914}100%{transform:scale(1);opacity:1;filter:brightness(1);text-shadow:0 0 30px rgba(229,9,20,.7)}}
.mf-logo-anim b:first-child{color:#fff;transform:translateX(-40px);opacity:0;animation:lm 1s .4s forwards}
.mf-logo-anim b:last-child{color:#e50914;transform:translateX(40px);opacity:0;animation:lf 1s .6s forwards}
@keyframes lm{to{transform:translateX(0);opacity:1}}@keyframes lf{to{transform:translateX(0);opacity:1}}
.sweep{position:absolute;top:50%;left:-50%;width:200%;height:4px;background:linear-gradient(90deg,transparent,#e50914,#fff,#e50914,transparent);transform:rotate(-12deg);opacity:0;animation:sweep 1s 1.5s forwards}
@keyframes sweep{0%{transform:rotate(-12deg) translateX(-100%);opacity:0}50%{opacity:1}100%{transform:rotate(-12deg) translateX(100%);opacity:0}}
.intro-txt{margin-top:18px;text-align:center;opacity:0;transform:translateY(15px);animation:up .8s 2.1s forwards}@keyframes up{to{opacity:1;transform:translateY(0)}}
.intro-txt b{font-family:'Bebas Neue';font-size:26px;letter-spacing:6px}.intro-txt div{font-size:9px;letter-spacing:4px;opacity:.5;margin-top:6px}
#intro.out{animation:out .9s cubic-bezier(.7,0,.3,1) forwards}@keyframes out{to{opacity:0;visibility:hidden;transform:scale(1.4);filter:blur(30px)}}
/* APP */
.screen{position:fixed;inset:0;background:#000;z-index:9000;display:none;padding:18px;overflow-y:auto}.screen.active{display:flex}.center{margin:auto;width:100%;max-width:400px}
.input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:16px;border-radius:6px;margin-top:14px;font-size:15px;outline:none}.input:focus{border-color:#e50914}
.btnR{width:100%;background:#e50914;color:#fff;border:none;padding:16px;border-radius:6px;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(to bottom,#000 70%,rgba(0,0,0,.6),transparent);padding:12px;display:flex;align-items:center;gap:10px}
.logo{font-family:'Bebas Neue';font-size:32px;color:#e50914}.logo b:first-child{color:#fff}
.search{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:10px 14px;color:#fff;outline:none}
.hero{margin:8px 12px 0;height:62vw;max-height:420px;border-radius:8px;overflow:hidden;position:relative;background:#111;cursor:pointer}.hero img{width:100%;height:100%;object-fit:cover}.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000 30%,rgba(0,0,0,.2) 60%,transparent)}.heroB{position:absolute;bottom:12px;left:12px;right:12px;z-index:2}
.badge{position:absolute;top:10px;left:10px;background:#e50914;color:#fff;font-size:10px;font-weight:900;padding:4px 8px;border-radius:3px;letter-spacing:1px;z-index:3}
.btnW{background:#fff;color:#000;border:none;border-radius:4px;padding:12px 22px;font-weight:900;cursor:pointer}.btnG{background:rgba(109,109,110,.7);color:#fff;border:none;border-radius:4px;padding:12px 18px;font-weight:700;cursor:pointer}
.sec{margin-top:22px;padding-left:12px}.secT{font-weight:700;font-size:16px;margin-bottom:10px}.row{display:flex;gap:8px;overflow-x:auto;padding-right:12px;scroll-behavior:smooth}.row::-webkit-scrollbar{display:none}
.card{width:118px;min-width:118px;height:168px;border-radius:6px;overflow:hidden;background:#151515;flex-shrink:0;cursor:pointer;position:relative;transition:.3s}.card:hover{transform:scale(1.06);z-index:2}.card img{width:100%;height:100%;object-fit:cover}.fav{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.numCard{display:flex;align-items:flex-end}.num{font-family:'Bebas Neue';font-size:110px;line-height:.8;color:#000;-webkit-text-stroke:1px #595959;transform:translateX(10px)}
.bottom{position:fixed;bottom:12px;left:10px;right:10px;background:rgba(35,35,35,.95);backdrop-filter:blur(20px);border-radius:30px;display:flex;justify-content:space-around;padding:10px 6px;z-index:30;border:1px solid #333}.b{flex:1;text-align:center;opacity:.6;font-size:10px;cursor:pointer}.b.active{opacity:1}.b img{width:26px;height:26px;border-radius:50%}
#app{display:none;padding-bottom:100px}#detail{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow-y:auto}#player{position:fixed;inset:0;background:#000;z-index:90;display:none;flex-direction:column}
.p-hero{position:absolute;inset:0;background-size:cover;opacity:.35}.p-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent,#000 90%)}
.pinDots{display:flex;gap:10px;justify-content:center;margin:24px 0}.pinDots div{width:52px;height:60px;border:2px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px}.pinDots div.filled{border-color:#fff;background:#111}
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.npad button{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:20px;border-radius:10px;font-size:22px;font-weight:700}
</style>
</head>
<body>

<div id="intro">
<div class="intro-bg"></div>
<div style="position:relative">
<div class="mf-logo-anim" id="mfAnim"><b>M</b><b>F</b></div>
<div class="sweep"></div>
</div>
<div class="intro-txt"><b>MADARA <span style="color:#e50914">FLIX</span></b><div>NETFLIX MODELE • 0 PUB • 0 REDIRECTION</div></div>
</div>

<div id="auth" class="screen active"><div class="center"><h1 style="font-family:'Bebas Neue';font-size:42px;letter-spacing:2px">MADARA <span style="color:#e50914">FLIX</span></h1><p style="opacity:.6;font-size:14px;margin-top:4px">Gmail ou Numéro = espace perso séparé</p><input id="ident" class="input" placeholder="Gmail ou Numéro"><input id="pass" type="password" class="input" placeholder="Mot de passe"><button class="btnR" onclick="login()">COMMENCER</button><div id="msg" style="color:#ff3b30;margin-top:12px;font-size:13px"></div></div></div>

<div id="profiles" class="screen"><div class="p-hero" id="pHero"></div><div class="center" style="position:relative;z-index:2;text-align:center;width:100%;max-width:600px"><h2 style="font-size:22px;font-weight:700;margin-top:20px">Qui regarde ?</h2><div id="pGrid" style="display:flex;gap:20px;justify-content:center;margin-top:28px;flex-wrap:wrap"></div><button onclick="showCreateP()" style="margin-top:28px;background:transparent;border:1px solid #555;color:#888;padding:10px 20px;border-radius:4px;cursor:pointer">+ Ajouter un profil</button><br><button onclick="showSettings()" style="margin-top:18px;background:transparent;border:none;color:#666;font-size:13px">⚙️ Gérer PIN</button><br><button onclick="logout()" style="margin-top:12px;background:transparent;border:none;color:#444;font-size:12px">Changer de compte</button></div></div>

<div id="createP" class="screen"><div class="center"><h2>Nouveau profil</h2><input id="pName" class="input" placeholder="Ex: Papa, Maman"><button class="btnR" onclick="saveP()">CRÉER</button><button class="input" onclick="hideCreateP()">Annuler</button></div></div>
<div id="settings" class="screen"><div class="center"><h2>Codes PIN</h2><div id="settingsList"></div><button class="input" onclick="hideSettings()">Fermer</button></div></div>
<div id="pinScreen" class="screen"><div class="center" style="text-align:center"><div id="pinAv" style="width:100px;height:100px;border-radius:8px;overflow:hidden;margin:0 auto;background:#222;border:2px solid #333"></div><h3 id="pinName" style="margin-top:14px;font-size:20px"></h3><div class="pinDots" id="dots"><div></div><div></div><div></div><div></div></div><div class="npad"><button onclick="tp(1)">1</button><button onclick="tp(2)">2</button><button onclick="tp(3)">3</button><button onclick="tp(4)">4</button><button onclick="tp(5)">5</button><button onclick="tp(6)">6</button><button onclick="tp(7)">7</button><button onclick="tp(8)">8</button><button onclick="tp(9)">9</button><button></button><button onclick="tp(0)">0</button><button onclick="dp()">⌫</button></div><button class="input" onclick="backP()">Retour</button></div></div>

<div id="app">
<div class="top"><div class="logo"><b>M</b><b>F</b></div><input id="searchInput" class="search" placeholder="Titres, personnes, genres" oninput="doSearch()"><div>🔔</div></div>
<div class="hero" id="hero"></div>
<div id="sections"></div>
<div class="bottom">
<div class="b active" onclick="showHome()"><div style="font-size:20px">⌂</div>Accueil</div>
<div class="b" onclick="showList()"><div style="font-size:20px">♥</div>Ma liste</div>
<div class="b" onclick="document.getElementById('searchInput').focus()"><div style="font-size:20px">⌕</div>Rechercher</div>
<div class="b active"><img id="bAv"><div>Mon MF</div></div>
</div>
</div>

<div id="detail"></div>
<div id="player">
<div style="position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);padding:12px;display:flex;align-items:center;gap:8px">
<button onclick="closePlayer()" style="background:#fff;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:800;cursor:pointer">✕</button>
<div id="playingTitle" style="font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
<button id="sv1" onclick="switchServer(1)" style="background:#fff;color:#000;border:none;padding:6px 12px;border-radius:12px;font-size:11px;font-weight:800">S1 0 PUB</button>
<button id="sv2" onclick="switchServer(2)" style="background:#222;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:12px;font-size:11px">S2</button>
</div>
<iframe id="frame" allowfullscreen allow="autoplay; fullscreen" style="width:100%;height:100%;border:none;background:#000"></iframe>
</div>

<script>
const TMDB_KEY="4d915c255bcab0ffd0b07dd2a63f3387";const W500="https://image.tmdb.org/t/p/w500",ORIG="https://image.tmdb.org/t/p/original";
let accounts=JSON.parse(localStorage.getItem('mf_v16_abs')||'{}');let curAcc=null,curProf=null,ALL=[],pin="",pinTarget=null,curMovie=null;let favs=[],cont=[];
function getFavKey(){return `mf_fav_${curAcc}_${curProf.id}`}function getContKey(){return `mf_cont_${curAcc}_${curProf.id}`}
function loadFavCont(){favs=JSON.parse(localStorage.getItem(getFavKey())||'[]');cont=JSON.parse(localStorage.getItem(getContKey())||'[]');}
setTimeout(()=>{document.getElementById('mfAnim').classList.add('active')},300);
setTimeout(()=>{document.getElementById('intro').classList.add('out');setTimeout(()=>document.getElementById('intro').style.display='none',900)},3800);
function login(){const id=document.getElementById('ident').value.trim().toLowerCase(),p=document.getElementById('pass').value.trim();if(!id||!p)return document.getElementById('msg').innerText="Remplis tout";if(!accounts[id]){accounts[id]={id,pass:p,profiles:[{id:Date.now().toString(),name:"Madara",avatar:"https://i.pravatar.cc/300?img=15",pin:null}]};localStorage.setItem('mf_v16_abs',JSON.stringify(accounts));}else if(accounts[id].pass!==p)return document.getElementById('msg').innerText="Faux";curAcc=id;showProfiles();}
function showProfiles(){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');s.style.display='none'});document.getElementById('profiles').classList.add('active');document.getElementById('profiles').style.display='flex';const acc=accounts[curAcc];document.getElementById('pGrid').innerHTML=acc.profiles.map(pr=>`<div onclick="openProf('${pr.id}')" style="cursor:pointer;text-align:center;width:110px"><img src="${pr.avatar}" style="width:100px;height:100px;border-radius:6px;object-fit:cover;border:2px solid ${pr.name==='Madara'?'#fff':'transparent'}"><div style="font-size:13px;margin-top:8px;opacity:.8">${pr.name} ${pr.pin?'🔒':''}</div></div>`).join('')+`<div onclick="showCreateP()" style="cursor:pointer;text-align:center;width:110px"><div style="width:100px;height:100px;border-radius:6px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:36px;color:#555;border:2px dashed #333">+</div><div style="font-size:12px;margin-top:8px;opacity:.5">Ajouter</div></div>`;}
function showCreateP(){document.getElementById('createP').classList.add('active');document.getElementById('createP').style.display='flex'}function hideCreateP(){document.getElementById('createP').classList.remove('active');document.getElementById('createP').style.display='none'}
function saveP(){const n=document.getElementById('pName').value.trim();if(!n)return alert('Nom');accounts[curAcc].profiles.push({id:Date.now().toString(),name:n,avatar:`https://i.pravatar.cc/300?img=${Math.floor(Math.random()*70)}`,pin:null});localStorage.setItem('mf_v16_abs',JSON.stringify(accounts));hideCreateP();showProfiles()}
function showSettings(){const acc=accounts[curAcc];document.getElementById('settingsList').innerHTML=acc.profiles.map(pr=>`<div style="background:#111;padding:14px;border-radius:6px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #222"><div><b>${pr.name}</b><br><span style="font-size:12px;opacity:.6">PIN: ${pr.pin||'Aucun'}</span></div><button onclick="setPin('${pr.id}')" style="background:#e50914;color:#fff;border:none;padding:8px 14px;border-radius:4px;font-weight:700">PIN</button></div>`).join('');document.getElementById('settings').classList.add('active');document.getElementById('settings').style.display='flex'}
function hideSettings(){document.getElementById('settings').classList.remove('active');document.getElementById('settings').style.display='none'}
function setPin(id){const code=prompt('4 chiffres (vide pour enlever):');if(code===null)return;if(code===''||/^\d{4}$/.test(code)){accounts[curAcc].profiles.find(p=>p.id===id).pin=code===''?null:code;localStorage.setItem('mf_v16_abs',JSON.stringify(accounts));showSettings();showProfiles()}}
function openProf(id){const pr=accounts[curAcc].profiles.find(p=>p.id===id);if(pr.pin){pinTarget=pr;pin="";document.getElementById('pinName').innerText=pr.name;document.getElementById('pinAv').innerHTML=`<img src="${pr.avatar}" style="width:100%;height:100%;object-fit:cover">`;upd();document.getElementById('pinScreen').classList.add('active');document.getElementById('pinScreen').style.display='flex'}else enterApp(pr)}
function tp(n){if(pin.length>=4)return;pin+=n;upd();if(pin.length===4){if(pin===pinTarget.pin){document.getElementById('pinScreen').style.display='none';enterApp(pinTarget)}else{pin="";upd();setTimeout(()=>alert('Faux'),100)}}}function dp(){pin=pin.slice(0,-1);upd()}function upd(){document.querySelectorAll('#dots div').forEach((d,i)=>{d.innerText=pin[i]?'•':''; if(pin[i]) d.classList.add('filled'); else d.classList.remove('filled')})}function backP(){document.getElementById('pinScreen').style.display='none'}
function logout(){document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active')});document.getElementById('auth').style.display='flex';document.getElementById('auth').classList.add('active')}
function enterApp(pr){curProf=pr;loadFavCont();document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active')});document.getElementById('app').style.display='block';document.getElementById('bAv').src=pr.avatar;load()}
async function fetchMulti(u){try{const r=await fetch(u);const j=await r.json();return j.results||[]}catch{return[]}}
async function load(){let res=[];res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}&language=fr-FR`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&language=fr-FR&page=1`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&language=fr-FR&page=2`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/tv/popular?api_key=${TMDB_KEY}&language=fr-FR&page=1`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=fr-FR&with_genres=16&page=1`));const map=new Map();res.forEach(m=>{if(!map.has(m.id))map.set(m.id,{id:m.id,title:m.title||m.name,poster:m.poster_path?W500+m.poster_path:'',backdrop:m.backdrop_path?ORIG+m.backdrop_path:W500+m.poster_path,overview:m.overview||'',type:m.media_type||(m.title?'movie':'tv'),vote:m.vote_average||0})});ALL=[...map.values()].slice(0,500);render();}
function render(){if(!ALL.length)return;document.getElementById('pHero').style.backgroundImage=`url('${ALL[0].backdrop}')`;const h=ALL[0];document.getElementById('hero').innerHTML=`<div class="badge">TOP 10</div><img src="${h.backdrop}"><div class="heroB"><h2 style="font-size:22px;font-weight:900;text-shadow:0 2px 10px #000">${h.title}</h2><p style="font-size:12px;opacity:.8;margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${h.overview}</p><div style="display:flex;gap:8px"><button class="btnW" onclick="playMovie(${h.id},'${h.type}','${h.title.replace(/'/g,"")}')">▶ Lecture</button><button class="btnG" onclick="toggleFav(${h.id})">${favs.includes(h.id)?'✓ Ma liste':'＋ Ma liste'}</button></div></div>`;let cats=[];if(cont.length) cats.push(["Reprendre avec "+curProf.name+" ▶",ALL.filter(m=>cont.includes(m.id)),false]);if(favs.length) cats.push(["Ma liste ❤️",ALL.filter(m=>favs.includes(m.id)),false]);cats.push(["Tendances",ALL.slice(1,16),true]);cats.push(["Films populaires",ALL.filter(m=>m.type==='movie').slice(0,15),false]);cats.push(["Séries",ALL.filter(m=>m.type==='tv').slice(0,15),false]);cats.push(["Top 10 Madara Flix",ALL.slice(0,10),true]);cats.push(["Anime",ALL.slice(30,45),false]);document.getElementById('sections').innerHTML=cats.filter(c=>c[1].length).map(([t,arr,isTop])=>`<div class="sec"><div class="secT">${t}</div><div class="row">${arr.map((m,i)=> isTop ? `<div class="numCard"><div class="num">${i+1}</div><div class="card" style="width:110px;min-width:110px" onclick="openDetail(${m.id})"><img src="${m.poster}" loading="lazy"></div></div>` : `<div class="card" onclick="openDetail(${m.id})"><img src="${m.poster}" loading="lazy"><div class="fav" onclick="event.stopPropagation();toggleFav(${m.id})">${favs.includes(m.id)?'♥':'♡'}</div></div>`).join('')}</div></div>`).join('');}
function doSearch(){const q=document.getElementById('searchInput').value.toLowerCase().trim();if(!q){render();return;}const filtered=ALL.filter(m=>m.title.toLowerCase().includes(q));document.getElementById('sections').innerHTML=`<div class="sec"><div class="secT">Résultats "${q}" (${filtered.length})</div><div class="row" style="flex-wrap:wrap">${filtered.map(m=>`<div class="card" onclick="openDetail(${m.id})"><img src="${m.poster}"></div>`).join('')||'<div style="opacity:.5;padding:20px">Aucun</div>'}</div></div>`;}
function showHome(){document.getElementById('searchInput').value='';render();window.scrollTo(0,0)}
function showList(){if(!favs.length) return alert('Ta liste est vide');const list=ALL.filter(m=>favs.includes(m.id));document.getElementById('sections').innerHTML=`<div class="sec"><div class="secT">Ma liste ♥ (${list.length})</div><div class="row" style="flex-wrap:wrap">${list.map(m=>`<div class="card" onclick="openDetail(${m.id})"><img src="${m.poster}"><div class="fav" onclick="event.stopPropagation();toggleFav(${m.id})">♥</div></div>`).join('')}</div></div>`;}
function toggleFav(id){if(favs.includes(id)) favs=favs.filter(f=>f!==id); else favs.push(id);localStorage.setItem(getFavKey(),JSON.stringify(favs));render();if(document.getElementById('detail').style.display==='block') openDetail(id);}
async function openDetail(id){const m=ALL.find(x=>x.id===id);if(!m)return;let seasons=[];try{const tv=await fetch(`https://api.themoviedb.org/3/tv/${m.id}?api_key=${TMDB_KEY}&language=fr-FR`).then(r=>r.json());if(tv?.number_of_seasons){for(let s=1;s<=Math.min(tv.number_of_seasons,10);s++){const sd=await fetch(`https://api.themoviedb.org/3/tv/${m.id}/season/${s}?api_key=${TMDB_KEY}&language=fr-FR`).then(r=>r.json()).catch(()=>null);if(sd?.episodes)seasons.push({num:s,name:sd.name||`Saison ${s}`,eps:sd.episodes})}}}catch{}let html=`<div style="height:68vh;background:url('${m.backdrop}') center/cover;position:relative"><button onclick="document.getElementById('detail').style.display='none'" style="position:absolute;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;padding:10px 16px;border-radius:50%;font-weight:800;backdrop-filter:blur(10px)">✕</button><div style="position:absolute;inset:0;background:linear-gradient(to top,#000 30%,rgba(0,0,0,.3),transparent)"></div></div><div style="padding:16px"><h2 style="font-size:24px;font-weight:900">${m.title}</h2><div style="display:flex;gap:8px;margin-top:8px;font-size:12px;opacity:.7"><span>★ ${m.vote.toFixed(1)}</span><span>•</span><span>${m.type==='tv'?'Série':'Film'}</span><span>•</span><span>4K</span></div><p style="opacity:.8;font-size:14px;margin-top:10px;line-height:1.5">${m.overview.slice(0,280)}</p><div style="display:flex;gap:10px;margin-top:16px"><button class="btnR" style="margin:0;flex:1;border-radius:4px" onclick="playMovie(${m.id},'${m.type}','${m.title.replace(/'/g,"")}')">▶ LECTURE 0 PUB</button><button class="btnG" style="margin:0;border-radius:4px;padding:16px 20px" onclick="toggleFav(${m.id})">${favs.includes(m.id)?'♥':'♡'}</button></div>`;if(seasons.length){html+=`<div style="margin-top:20px"><h3>Épisodes</h3><div style="display:flex;gap:8px;overflow-x:auto;margin-top:12px">`+seasons.map((s,i)=>`<button onclick="showS(${i})" id="sBtn${i}" style="background:${i==0?'#fff':'#222'};color:${i==0?'#000':'#fff'};border:none;padding:8px 16px;border-radius:20px;font-weight:700;white-space:nowrap">${s.name}</button>`).join('')+`</div><div id="eps" style="margin-top:12px"></div></div>`}html+=`</div>`;document.getElementById('detail').innerHTML=html;document.getElementById('detail').style.display='block';window._seasons=seasons;window._mid=m.id;window._mtitle=m.title;if(seasons.length)showS(0);}
function showS(idx){document.querySelectorAll('[id^=sBtn]').forEach(b=>{b.style.background='#222';b.style.color='#fff'});const a=document.getElementById('sBtn'+idx);if(a){a.style.background='#fff';a.style.color='#000'}const s=window._seasons[idx];document.getElementById('eps').innerHTML=s.eps.map(ep=>`<div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a;cursor:pointer" onclick="playEpisode(${window._mid},${s.num},${ep.episode_number},'${(window._mtitle+' E'+ep.episode_number).replace(/'/g,"")}')"><div style="opacity:.5;font-weight:800;font-size:18px;min-width:24px">${ep.episode_number}</div><img src="${ep.still_path?W500+ep.still_path:''}" style="width:120px;height:68px;border-radius:4px;background:#111;object-fit:cover"><div style="flex:1"><div style="font-size:14px;font-weight:700">${ep.name||'Épisode '+ep.episode_number}</div><div style="font-size:12px;opacity:.6;margin-top:2px">${(ep.overview||'').slice(0,80)}</div></div><div>▶</div></div>`).join('');}
function getUrl(server,type,id,s,e){const isTV = type==='tv' || window._seasons?.length; if(isTV){return server===1?`https://player.videasy.net/tv/${id}/${s||1}/${e||1}`:`https://embed.vidrift.net/embed/tv/${id}/${s||1}/${e||1}`}else{return server===1?`https://player.videasy.net/movie/${id}`:`https://embed.vidrift.net/embed/movie/${id}`}}
function playMovie(id,type,title){curMovie={id,type,s:1,e:1};document.getElementById('playingTitle').innerText=title||'';if(!cont.includes(id)){cont.unshift(id);cont=cont.slice(0,25);localStorage.setItem(getContKey(),JSON.stringify(cont));}document.getElementById('frame').src=getUrl(1,type,id);document.getElementById('player').style.display='flex';}
function playEpisode(tvId,season,episode,title){curMovie={id:tvId,type:'tv',s:season,e:episode};document.getElementById('playingTitle').innerText=title||'';if(!cont.includes(tvId)){cont.unshift(tvId);cont=cont.slice(0,25);localStorage.setItem(getContKey(),JSON.stringify(cont));}document.getElementById('frame').src=getUrl(1,'tv',tvId,season,episode);document.getElementById('player').style.display='flex';}
function switchServer(n){if(!curMovie)return;document.getElementById('sv1').style.background=n===1?'#fff':'#222';document.getElementById('sv1').style.color=n===1?'#000':'#fff';document.getElementById('sv2').style.background=n===2?'#fff':'#222';document.getElementById('sv2').style.color=n===2?'#000':'#fff';document.getElementById('frame').src=getUrl(n,curMovie.type,curMovie.id,curMovie.s,curMovie.e);}
function closePlayer(){document.getElementById('frame').src='';document.getElementById('player').style.display='none';}
</script>
</body>
</html>
