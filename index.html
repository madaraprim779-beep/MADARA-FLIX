<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADARAFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141414;color:#fff;font-family:Arial, sans-serif}

/* INTRO CORRIGEE - 4 SECONDES */
#intro{
 position:fixed; inset:0; background:#000; z-index:99999;
 display:flex; align-items:center; justify-content:center;
}
#intro h1{
 font-family:Impact, Arial Black;
 font-size:11vw; /* s'adapte à l'écran */
 color:#e50914;
 letter-spacing:2px;
 font-weight:900;
 transform:scaleY(0.8);
 animation: netflix 4s ease-in-out forwards;
 white-space:nowrap;
}
@keyframes netflix{
 0%{opacity:0; transform:scale(0.5) scaleY(0.8); letter-spacing:20px; filter:blur(10px)}
 20%{opacity:1; transform:scale(1.1) scaleY(1); filter:blur(0); text-shadow:0 0 30px #e50914}
 30%{transform:scale(1) scaleY(1)}
 80%{transform:scale(1) scaleY(1); opacity:1; text-shadow:0 0 20px #e50914}
 100%{transform:scale(2.5) scaleY(1); opacity:0; letter-spacing:30px; filter:blur(10px)}
}
</style>
</head>
<body>
<div id="intro"><h1>MADARAFLIX</h1></div>

<!-- TON SITE EN DESSOUS -->
<div id="site" style="padding:20px; text-align:center; margin-top:50px">
<h2 style="color:#e50914">MADARAFLIX CHARGEMENT...</h2>
<p>Ton site va s'afficher ici après l'intro</p>
</div>

<script>
setTimeout(()=>{document.getElementById('intro').style.display='none'},4000);
</script>
</body>
</html>
