<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADARA FLIX</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;overflow-x:hidden}
/* INTRO NETFLIX MAIS MADARA FLIX */
#intro{position:fixed;inset:0;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mfIntro{font-family:'Bebas Neue';font-size:72px;letter-spacing:2px;display:flex;gap:2px;opacity:0;transform:scale(.8);filter:blur(15px)}
.mfIntro.go{animation:mfGo 2.8s cubic-bezier(.7,0,.3,1) forwards}
.mfIntro b:first-child{color:#fff}.mfIntro b:last-child{color:#e50914}
@keyframes mfGo{
0%{opacity:0;transform:scale(.8);filter:blur(20px);letter-spacing:-10px}
25%{opacity:1;filter:blur(0);letter-spacing:2px;transform:scale(1)}
55%{transform:scale(1);text-shadow:0 0 50px #e50914;letter-spacing:6px}
100%{opacity:0;transform:scale(1.4);filter:blur(12px);letter-spacing:12px}
}
#intro.out{animation:out .8s forwards}@keyframes out{to{opacity:0;visibility:hidden}}
/* PROFILS COMME TA VIDEO */
#profiles{position:fixed;inset:0;background:#000;z-index:8000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.profGrid{display:grid;grid-template-columns:repeat(3,90px);gap:22px 34px;margin-top:24px}
.prof{cursor:pointer;text-align:center}.prof img{width:90px;height:90px;border-radius:6px;object-fit:cover;border:3px solid transparent;transition:.2s}.prof:hover img{border-color:#fff}.prof.active img{border-color:#fff}
.prof span{font-size:12px;margin-top:6px;display:block;opacity:.7}
.loader{width:56px;height:56px;border:4px solid #222;border-top-color:#e50914;border-radius:50%;animation:spin .7s linear infinite;display:none;margin-top:20px}@keyframes spin{to{transform:rotate(360deg)}}
/* APP NETFLIX CLONE MAIS MADARA FLIX */
#app{display:none;background:#000;min-height:100vh;padding-bottom:85px}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(to bottom,#000 70%,rgba(0,0,0,.7) 85%,transparent);padding:10px 12px 16px}
.top1{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bebas Neue';font-size:34px;letter-spacing:1px;color:#e50914}.logo b:first-child{color:#fff}
.pills{display:flex;gap:8px;overflow-x:auto;margin-top:12px}.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid #555;color:#fff;padding:5px 12px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer}.pill.active{background:#fff;color:#000;border-color:#fff;font-weight:800}
.hero{margin:0 12px;height:60vw;max-height:430px;border-radius:6px;overflow:hidden;position:relative;background:#111;cursor:pointer}.hero img{width:100%;height:100%;object-fit:cover}.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000 30%,transparent 65%)}
.heroInfo{position:absolute;bottom:12px;left:0;right:0;z-index:2;text-align:center;padding:0 12px}
.heroBtns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.btnPlay{background:#fff;color:#000;border:none;padding:10px 20px;border-radius:4px;font-weight:900;display:flex;align-items:center;gap:5px}
.btnList{background:rgba(90,90,90,.8);color:#fff;border:none;padding:10px 18px;border-radius:4px;font-weight:600}
.sec{margin-top:20px;padding-left:12px}.secT{font-size:14px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:7px;overflow-x:auto;padding-right:12px}.row::-webkit-scrollbar{display:none}
.card{width:114px;min-width:114px;height:162px;border-radius:4px;overflow:hidden;background:#181818;flex-shrink:0;cursor:pointer;position:relative}.card img{width:100%;height:100%;object-fit:cover}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#121212;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 16px;z-index:40}
.bItem{flex:1;text-align:center;opacity:.55;font-size:9px}.bItem.active{opacity:1}.bItem div:first-child{font-size:20px;margin-bottom:3px}
#detail{position:fixed;inset:0;background:#000;z-index:70;display:none;overflow-y:auto}
#player{position:fixed;inset:0;background:#000;z-index:90;display:none;flex-direction:column}
</style>
</head>
<body>

<div id="intro"><div class="mfIntro" id="mfLogo"><b>MADARA</b><b>&nbsp;FLIX</b></div></div>

<div id="profiles">
<img id="bigProf" src="https://i.pravatar.cc/300?img=15" style="width:110px;height:110px;border-radius:8px;border:3px solid #fff;object-fit:cover">
<div class="loader" id="loader"></div>
<div style="margin-top:18px;font-size:14px;opacity:.7">Choisissez votre profil</div>
<div class="profGrid" id="profGrid"></div>
<div style="margin-top:28px;opacity:.4;font-size:12px">✎ Gérer les profils</div>
</div>

<div id="app">
<div class="top">
<div class="top1"><div class="logo"><b>M</b><b>F</b></div><div style="display:flex;gap:14px;font-size:18px"><span>🔍</span><span>🔔</span></div></div>
<div class="pills"><div class="pill active">Séries</div><div class="pill">Films</div><div class="pill">Anime</div><div class="pill">Ma liste</div><div class="pill">Tou</div></div>
</div>
<div class="hero" id="hero"></div>
<div id="sections"></div>
<div class="bottom">
<div class="bItem active"><div>⌂</div>Accueil</div>
<div class="bItem"><div>◫</div>Extraits</div>
<div class="bItem"><div>⌕</div>Rechercher</div>
<div class="bItem"><div style="width:22px;height:22px;border-radius:4px;background:#e50914;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-weight:900">M</div>Mon MF</div>
</div>
</div>

<div id="detail"></div>
<div id="player">
<div style="position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.95),transparent);padding:10px;display:flex;gap:8px;align-items:center">
<button onclick="closePlayer()" style="background:#fff;color:#000;border:none;padding:7px 12px;border-radius:20px;font-weight:800">✕</button>
<div id="playingTitle" style="flex:1;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
<button id="s1" onclick="switchS(1)" style="background:#fff;color:#000;border:none;padding:5px 10px;border-radius:12px;font-size:10px;font-weight:800">S1 0 PUB</button>
<button id="s2" onclick="switchS(2)" style="background:#222;color:#fff;border:1px solid #444;padding:5px 10px;border-radius:12px;font-size:10px">S2</button>
</div>
<iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen allow="autoplay; fullscreen; encrypted-media" style="width:100%;height:100%;border:none;background:#000"></iframe>
</div>

<script>
const KEY="4d915c255bcab0ffd0b07dd2a63f3387";const W500="https://image.tmdb.org/t/p/w500",ORIG="https://image.tmdb.org/t/p/original";
let ALL=[],cur=null,cont=JSON.parse(localStorage.getItem('mf_cont')||'[]'),favs=JSON.parse(localStorage.getItem('mf_fav')||'[]');
const PROFS=[
{name:"Madara225",img:"https://i.pravatar.cc/300?img=15"},
{name:"Minata",img:"https://i.pravatar.cc/300?img=26"},
{name:"Jedel",img:"https://i.pravatar.cc/300?img=68"},
{name:"Madara",img:"https://i.pravatar.cc/300?img=12"},
{name:"Sylia",img:"https://i.pravatar.cc/300?img=45"},
];
// INTRO MADARA FLIX
setTimeout(()=>document.getElementById('mfLogo').classList.add('go'),200);
setTimeout(()=>{
 document.getElementById('intro').classList.add('out');
 document.getElementById('profiles').style.display='flex';
 document.getElementById('profGrid').innerHTML=PROFS.map((p,i)=>`<div class="prof ${i==0?'active':''}" onclick="pick(${i})"><img src="${p.img}"><span>${p.name}</span></div>`).join('');
},2800);
function pick(i){
 const p=PROFS[i];
 document.getElementById('bigProf').src=p.img;
 document.getElementById('profGrid').style.display='none';
 document.getElementById('loader').style.display='block';
 setTimeout(()=>{
  document.getElementById('profiles').style.display='none';
  document.getElementById('app').style.display='block';
  load();
 },1100);
}
// ANTI PUB COFFRE
window.open=()=>null;
async function fetchM(u){try{const r=await fetch(u);const j=await r.json();return j.results||[]}catch{return[]}}
async function load(){
 let r=[];
 r=r.concat(await fetchM(`https://api.themoviedb.org/3/trending/all/day?api_key=${KEY}&language=fr-FR`));
 r=r.concat(await fetchM(`https://api.themoviedb.org/3/movie/popular?api_key=${KEY}&language=fr-FR&page=1`));
 r=r.concat(await fetchM(`https://api.themoviedb.org/3/movie/popular?api_key=${KEY}&language=fr-FR&page=2`));
 r=r.concat(await fetchM(`https://api.themoviedb.org/3/tv/popular?api_key=${KEY}&language=fr-FR&page=1`));
 r=r.concat(await fetchM(`https://api.themoviedb.org/3/discover/tv?api_key=${KEY}&language=fr-FR&with_genres=16&page=1`));
 const m=new Map();r.forEach(x=>{if(!m.has(x.id))m.set(x.id,{id:x.id,title:x.title||x.name,poster:x.poster_path?W500+x.poster_path:'',backdrop:x.backdrop_path?ORIG+x.backdrop_path:W500+x.poster_path,overview:x.overview||'',type:x.media_type||(x.title?'movie':'tv')})});
 ALL=[...m.values()].slice(0,300);render();
}
function render(){
 const h=ALL[0];
 document.getElementById('hero').innerHTML=`<img src="${h.backdrop}"><div class="heroInfo"><h2 style="font-size:20px;font-weight:900;text-shadow:0 2px 10px #000">${h.title}</h2><div class="heroBtns"><button class="btnPlay" onclick="playM(${h.id},'${h.type}','${h.title.replace(/'/g,"")}')">▶ Regarder</button><button class="btnList" onclick="openD(${h.id})">ⓘ Ma liste</button></div></div>`;
 const rows=[
  ["Reprendre avec le profil de Madara225",ALL.filter(x=>cont.includes(x.id))],
  ["Les séries regardées en boucle",ALL.slice(1,12)],
  ["Parce que vous avez ajouté S.W.A.T. à votre liste",ALL.slice(5,16)],
  ["Anime et titres inspirés de l'animation japonaise",ALL.slice(20,36)],
  ["Séries à suspense",ALL.filter(x=>x.type==='tv').slice(0,12)],
  ["Vous n'allez pas vous ennuyer",ALL.slice(12,24)],
  ["Nouveautés MADARA FLIX",ALL.slice(0,10)],
 ];
 document.getElementById('sections').innerHTML=rows.filter(r=>r[1].length).map(([t,a])=>`<div class="sec"><div class="secT">${t}</div><div class="row">${a.map(m=>`<div class="card" onclick="openD(${m.id})"><img src="${m.poster}" loading="lazy"></div>`).join('')}</div></div>`).join('');
}
async function openD(id){
 const m=ALL.find(x=>x.id===id);if(!m)return;
 let seasons=[];
 try{
  const tv=await fetch(`https://api.themoviedb.org/3/tv/${m.id}?api_key=${KEY}&language=fr-FR`).then(r=>r.json());
  if(tv?.number_of_seasons){for(let s=1;s<=Math.min(tv.number_of_seasons,6);s++){const sd=await fetch(`https://api.themoviedb.org/3/tv/${m.id}/season/${s}?api_key=${KEY}&language=fr-FR`).then(r=>r.json()).catch(()=>null);if(sd?.episodes)seasons.push({num:s,name:`Saison ${s}`,eps:sd.episodes})}}
 }catch{}
 let h=`<div style="height:60vh;background:url('${m.backdrop}') center/cover;position:relative"><button onclick="document.getElementById('detail').style.display='none'" style="position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;border:none;padding:8px 12px;border-radius:50%">←</button><div style="position:absolute;inset:0;background:linear-gradient(to top,#000 25%,transparent)"></div></div><div style="padding:14px"><h2 style="font-size:20px;font-weight:800">${m.title}</h2><p style="opacity:.7;font-size:13px;margin-top:8px">${m.overview.slice(0,240)}</p><div style="display:flex;gap:8px;margin-top:14px"><button class="btnPlay" style="flex:1;justify-content:center" onclick="playM(${m.id},'${m.type}','${m.title.replace(/'/g,"")}')">▶ LECTURE 0 PUB</button><button class="btnList" onclick="toggleF(${m.id})">${favs.includes(m.id)?'✓':'＋'}</button></div>`;
 if(seasons.length){h+=`<div style="margin-top:18px"><div style="display:flex;gap:8px;overflow-x:auto">`+seasons.map((s,i)=>`<button onclick="showS(${i})" id="b${i}" style="background:${i==0?'#fff':'#333'};color:${i==0?'#000':'#fff'};border:none;padding:6px 14px;border-radius:16px;font-size:12px;white-space:nowrap">${s.name}</button>`).join('')+`</div><div id="eps" style="margin-top:12px"></div></div>`}
 h+=`</div>`;
 document.getElementById('detail').innerHTML=h;document.getElementById('detail').style.display='block';
 window._seasons=seasons;window._mid=m.id;window._mtitle=m.title;if(seasons.length)showS(0);
}
function showS(i){document.querySelectorAll('[id^=b]').forEach(b=>{b.style.background='#333';b.style.color='#fff'});const a=document.getElementById('b'+i);if(a){a.style.background='#fff';a.style.color='#000'}const s=window._seasons[i];document.getElementById('eps').innerHTML=s.eps.map(ep=>`<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #222;cursor:pointer" onclick="playE(${window._mid},${s.num},${ep.episode_number},'${(window._mtitle+' E'+ep.episode_number).replace(/'/g,"")}')"><div style="opacity:.5;min-width:20px">${ep.episode_number}</div><img src="${ep.still_path?W500+ep.still_path:''}" style="width:110px;height:62px;border-radius:4px;background:#111;object-fit:cover"><div style="flex:1"><div style="font-size:13px;font-weight:600">${ep.name||'Épisode '+ep.episode_number}</div></div><div>▶</div></div>`).join('');}
function toggleF(id){if(favs.includes(id))favs=favs.filter(f=>f!==id);else favs.push(id);localStorage.setItem('mf_fav',JSON.stringify(favs));}
function getUrl(sv,type,id,s,e){
 if(sv==1){return type==='tv'||window._seasons?.length?`/api/stream?id=${id}&type=tv&s=${s||1}&e=${e||1}`:`/api/stream?id=${id}&type=movie`}
 else {return type==='tv'||window._seasons?.length?`https://player.videasy.net/tv/${id}/${s||1}/${e||1}`:`https://player.videasy.net/movie/${id}`}
}
function playM(id,type,title){cur={id,type,s:1,e:1};document.getElementById('playingTitle').innerText=title||'';if(!cont.includes(id)){cont.unshift(id);cont=cont.slice(0,20);localStorage.setItem('mf_cont',JSON.stringify(cont));}document.getElementById('frame').src=getUrl(1,type,id);document.getElementById('player').style.display='flex';}
function playE(tvId,se,ep,title){cur={id:tvId,type:'tv',s:se,e:ep};document.getElementById('playingTitle').innerText=title||'';if(!cont.includes(tvId)){cont.unshift(tvId);cont=cont.slice(0,20);localStorage.setItem('mf_cont',JSON.stringify(cont));}document.getElementById('frame').src=getUrl(1,'tv',tvId,se,ep);document.getElementById('player').style.display='flex';}
function switchS(n){if(!cur)return;document.getElementById('s1').style.background=n==1?'#fff':'#222';document.getElementById('s1').style.color=n==1?'#000':'#fff';document.getElementById('s2').style.background=n==2?'#fff':'#222';document.getElementById('s2').style.color=n==2?'#000':'#fff';document.getElementById('frame').src=getUrl(n,cur.type,cur.id,cur.s,cur.e);}
function closePlayer(){document.getElementById('frame').src='about:blank';document.getElementById('player').style.display='none';}
</script>
</body>
</html>
