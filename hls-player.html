<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e50914">
  <title>Lecteur — MADARA FLIX</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #111;
      border-bottom: 2px solid #e50914;
    }

    .logo {
      color: #e50914;
      font-size: 23px;
      font-weight: 900;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 18px;
    }

    a { color: #fff; }

    video {
      width: 100%;
      display: block;
      background: #000;
      border-radius: 12px;
      margin-top: 18px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 9px;
      border-radius: 8px;
      font-size: 15px;
    }

    input, select {
      background: #171717;
      border: 1px solid #444;
      color: #fff;
    }

    button {
      background: #e50914;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    .panel {
      background: #151515;
      padding: 16px;
      border-radius: 12px;
      margin-top: 18px;
    }

    .muted {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    #status {
      color: #ff7777;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">MADARA FLIX</div>
    <div class="muted">TON UNIVERS. SANS LIMITES.</div>
  </header>

  <main>
    <p><a href="./catalogue.html">← Retour au catalogue</a></p>

    <h1 id="videoTitle">Lecteur vidéo</h1>

    <video id="video" controls playsinline preload="metadata"></video>

    <section class="panel">
      <label for="quality">Qualité disponible</label>
      <select id="quality">
        <option value="-1">Automatique</option>
      </select>

      <p id="status" role="status">En attente d'une adresse vidéo.</p>
      <p class="muted">
        Les qualités affichées dépendent du flux vidéo. Choisir « 4K »
        ou « 8K » ne crée pas une résolution absente de la source.
      </p>
    </section>

    <section class="panel">
      <h2>Ouvrir un autre flux autorisé</h2>
      <form id="streamForm">
        <label for="streamUrl">Adresse HLS (.m3u8)</label>
        <input id="streamUrl" type="url"
          placeholder="https://exemple.com/video.m3u8" required>
        <button type="submit">Charger la vidéo</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const title = document.getElementById("videoTitle");
    const quality = document.getElementById("quality");
    const status = document.getElementById("status");
    const streamUrl = document.getElementById("streamUrl");

    let hls = null;

    function showStatus(message) {
      status.textContent = message;
    }

    function loadStream(url) {
      let parsed;

      try {
        parsed = new URL(url);
      } catch {
        showStatus("Adresse vidéo invalide.");
        return;
      }

      if (!["https:", "http:"].includes(parsed.protocol)) {
        showStatus("L'adresse doit utiliser HTTP ou HTTPS.");
        return;
      }

      if (!parsed.pathname.toLowerCase().endsWith(".m3u8")) {
        showStatus("Cette version attend un flux HLS se terminant par .m3u8.");
        return;
      }

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();
      quality.innerHTML = '<option value="-1">Automatique</option>';
      showStatus("Connexion au flux vidéo…");

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          const levels = hls.levels;
          quality.innerHTML = '<option value="-1">Automatique</option>';

          levels.forEach((level, index) => {
            const option = document.createElement("option");
            option.value = String(index);

            const height = level.height
              ? level.height + "p"
              : "Qualité " + (index + 1);

            const bitrate = level.bitrate
              ? " — " + Math.round(level.bitrate / 1000) + " kb/s"
              : "";

            option.textContent = height + bitrate;
            quality.appendChild(option);
          });

          showStatus(
            levels.length
              ? "Flux chargé. " + levels.length + " niveau(x) de qualité disponible(s)."
              : "Flux chargé. Qualité automatique."
          );
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            showStatus(
              "Impossible de lire ce flux. Vérifie l'adresse, les droits d'accès et la compatibilité CORS."
            );
          }
        });

        hls.loadSource(parsed.href);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = parsed.href;
        showStatus("Lecture HLS native disponible. Le choix manuel de qualité peut ne pas être pris en charge.");
      } else {
        showStatus("Ce navigateur ne prend pas en charge HLS. Essaie un navigateur compatible.");
      }

      streamUrl.value = parsed.href;
    }

    quality.addEventListener("change", function() {
      if (hls) {
        hls.currentLevel = Number(quality.value);
      }
    });

    document.getElementById("streamForm").addEventListener("submit", function(event) {
      event.preventDefault();
      loadStream(streamUrl.value.trim());
    });

    const params = new URLSearchParams(window.location.search);
    const incomingTitle = params.get("title");
    const incomingUrl = params.get("src");

    if (incomingTitle) {
      title.textContent = incomingTitle;
      document.title = incomingTitle + " — MADARA FLIX";
    }

    if (incomingUrl) {
      loadStream(incomingUrl);
    } else {
      showStatus("Ajoute un flux HLS autorisé pour commencer.");
    }
  </script>
</body>
</html>
