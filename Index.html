<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADARA FLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}
#intro{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mf{font-family:Impact;font-size:120px;font-weight:900;letter-spacing:-6px;display:flex;transform:scale(.7);opacity:0;animation:pop 1s .3s forwards}
.mf b:last-child{color:#e50914}@keyframes pop{to{transform:scale(1);opacity:1}}
.light{position:absolute;top:50%;left:-30%;width:160%;height:3px;background:linear-gradient(90deg,transparent,#e50914,#fff,transparent);transform:rotate(-18deg) translateX(-120%);animation:lm 1.2s .9s forwards}
@keyframes lm{to{transform:rotate(-18deg) translateX(120%)}}
.sub{margin-top:10px;opacity:0;animation:fade .8s 1.6s forwards;text-align:center}.sub b{letter-spacing:5px;font-size:20px} @keyframes fade{to{opacity:1}} #intro.out{animation:out .8s forwards}@keyframes out{to{opacity:0;visibility:hidden;transform:scale(1.3);filter:blur(20px)}}
.screen{position:fixed;inset:0;background:#000;z-index:9000;display:none;padding:18px;overflow-y:auto}.screen.active{display:flex}.center{margin:auto;width:100%;max-width:380px}
.input{width:100%;background:#1e1e1e;border:1px solid #333;color:#fff;padding:15px;border-radius:8px;margin-top:12px}.btnR{width:100%;background:#e50914;color:#fff;border:none;padding:15px;border-radius:8px;font-weight:900;margin-top:16px;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.95);backdrop-filter:blur(10px);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mf-logo{font-family:Impact;font-size:28px;color:#e50914;flex-shrink:0}.mf-logo b:first-child{color:#fff}
.search{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:20px;padding:8px 14px;color:#fff;outline:none}
.hero{margin:0 12px;height:56vw;max-height:380px;border-radius:10px;overflow:hidden;position:relative;background:#111}.hero img{width:100%;height:100%;object-fit:cover}.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000 50%,transparent)}.heroB{position:absolute;bottom:10px;left:10px;right:10px;z-index:2}
.btnW{width:100%;background:#fff;color:#000;border:none;border-radius:6px;padding:13px;font-weight:900;display:flex;justify-content:center;cursor:pointer}.btnG{width:100%;background:rgba(120,120,120,.4);color:#fff;border:none;border-radius:6px;padding:12px;margin-top:8px;display:flex;justify-content:center;font-weight:700;cursor:pointer}
.sec{margin-top:20px;padding-left:12px}.secT{font-weight:700;margin-bottom:10px}.row{display:flex;gap:8px;overflow-x:auto;padding-right:12px}.row::-webkit-scrollbar{display:none}.card{width:112px;min-width:112px;height:162px;border-radius:6px;overflow:hidden;background:#111;flex-shrink:0;cursor:pointer;position:relative}.card img{width:100%;height:100%;object-fit:cover}.card .fav{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px}
.bottom{position:fixed;bottom:12px;left:10px;right:10px;background:#232323;border-radius:28px;display:flex;justify-content:space-around;padding:8px;z-index:30}.b{flex:1;text-align:center;opacity:.6;font-size:10px;cursor:pointer}.b.active{opacity:1}.b img{width:26px;height:26px;border-radius:50%}
#app{display:none;padding-bottom:95px}#detail{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow-y:auto}#player{position:fixed;inset:0;background:#000;z-index:90;display:none;flex-direction:column}
.p-hero{position:absolute;inset:0;background-size:cover;opacity:.4}.p-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent,#000 90%)}
.pinDots{display:flex;gap:10px;justify-content:center;margin:20px 0}.pinDots div{width:50px;height:58px;border:2px solid #444;border-radius:10px;display:flex;align-items:center;justify-content:center}.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.npad button{background:#222;border:none;color:#fff;padding:18px;border-radius:12px;font-size:20px;font-weight:700}
</style>
</head>
<body>
<div id="intro"><div style="position:relative"><div class="mf"><b>M</b><b>F</b></div><div class="light"></div></div><div class="sub"><b>MADARA <span style="color:#e50914">FLIX</span></b><div style="font-size:9px;letter-spacing:4px;opacity:.5;margin-top:6px">0 PUB • TOUT INCLUS</div></div></div>

<div id="auth" class="screen active"><div class="center"><h1 style="font-weight:900;font-size:32px">MADARA <span style="color:#e50914">FLIX</span></h1><input id="ident" class="input" placeholder="Gmail ou Numéro"><input id="pass" type="password" class="input" placeholder="Mot de passe"><button class="btnR" onclick="login()">Continuer</button><div id="msg" style="color:#ff3b30;margin-top:10px;font-size:13px"></div></div></div>

<div id="profiles" class="screen"><div class="p-hero" id="pHero"></div><div class="center" style="position:relative;z-index:2;text-align:center"><h3>Choisissez votre profil</h3><div id="pGrid" style="display:flex;gap:18px;justify-content:center;margin-top:20px;flex-wrap:wrap"></div><button onclick="showCreateP()" style="margin-top:24px;background:#222;border:1px solid #333;color:#fff;padding:10px 18px;border-radius:20px">+ Ajouter</button><br><button onclick="showSettings()" style="margin-top:14px;background:transparent;border:none;color:#888">⚙️ PIN</button><br><button onclick="logout()" style="margin-top:8px;background:transparent;border:none;color:#555;font-size:12px">Changer Gmail</button></div></div>

<div id="createP" class="screen"><div class="center"><h2>Nouveau profil</h2><input id="pName" class="input" placeholder="Nom"><button class="btnR" onclick="saveP()">Créer</button><button class="input" onclick="hideCreateP()">Annuler</button></div></div>
<div id="settings" class="screen"><div class="center"><h2>PIN</h2><div id="settingsList"></div><button class="input" onclick="hideSettings()">Fermer</button></div></div>
<div id="pinScreen" class="screen"><div class="center" style="text-align:center"><div id="pinAv" style="width:90px;height:90px;border-radius:16px;overflow:hidden;margin:0 auto;background:#222"></div><h3 id="pinName" style="margin-top:10px"></h3><div class="pinDots" id="dots"><div></div><div></div><div></div><div></div></div><div class="npad"><button onclick="tp(1)">1</button><button onclick="tp(2)">2</button><button onclick="tp(3)">3</button><button onclick="tp(4)">4</button><button onclick="tp(5)">5</button><button onclick="tp(6)">6</button><button onclick="tp(7)">7</button><button onclick="tp(8)">8</button><button onclick="tp(9)">9</button><button></button><button onclick="tp(0)">0</button><button onclick="dp()">⌫</button></div><button class="input" onclick="backP()">Retour</button></div></div>

<div id="app">
<div class="top"><div class="mf-logo"><b>M</b><b>F</b></div><input id="searchInput" class="search" placeholder="Rechercher film, série..." oninput="doSearch()"><div style="font-size:22px">🔔</div></div>
<div class="hero" id="hero"></div>
<div id="sections"></div>
<div class="bottom">
<div class="b active" onclick="showHome()"><div style="font-size:22px">⌂</div>Accueil</div>
<div class="b" onclick="showList()"><div style="font-size:22px">♥</div>Ma Liste</div>
<div class="b" onclick="document.getElementById('searchInput').focus()"><div style="font-size:22px">⌕</div>Rechercher</div>
<div class="b active"><img id="bAv"><div>Mon MF</div></div>
</div>
</div>

<div id="detail"></div>
<div id="player">
  <div style="position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);padding:12px;display:flex;align-items:center;gap:8px">
    <button onclick="closePlayer()" style="background:#fff;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:800">✕</button>
    <div id="playingTitle" style="font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
    <button id="sv1" onclick="switchServer(1)" style="background:#fff;color:#000;border:none;padding:6px 10px;border-radius:12px;font-size:11px;font-weight:800">S1 0 PUB</button>
    <button id="sv2" onclick="switchServer(2)" style="background:#222;color:#fff;border:1px solid #444;padding:6px 10px;border-radius:12px;font-size:11px">S2</button>
  </div>
  <iframe id="frame" allowfullscreen allow="autoplay; fullscreen" style="width:100%;height:100%;border:none;background:#000"></iframe>
</div>

<script>
const TMDB_KEY="4d915c255bcab0ffd0b07dd2a63f3387";const W500="https://image.tmdb.org/t/p/w500",ORIG="https://image.tmdb.org/t/p/original";
let accounts=JSON.parse(localStorage.getItem('mf_v15_all')||'{}');let curAcc=null,curProf=null,ALL=[],pin="",pinTarget=null,curMovie=null;
let favs=[],cont=[];
function getFavKey(){return `mf_fav_${curAcc}_${curProf.id}`}function getContKey(){return `mf_cont_${curAcc}_${curProf.id}`}
function loadFavCont(){favs=JSON.parse(localStorage.getItem(getFavKey())||'[]');cont=JSON.parse(localStorage.getItem(getContKey())||'[]');}

function login(){const id=document.getElementById('ident').value.trim().toLowerCase(),p=document.getElementById('pass').value.trim();if(!id||!p)return document.getElementById('msg').innerText="Remplis";if(!accounts[id]){accounts[id]={id,pass:p,profiles:[{id:Date.now().toString(),name:"Madara",avatar:"https://i.pravatar.cc/300?img=15",pin:null}]};localStorage.setItem('mf_v15_all',JSON.stringify(accounts));}else if(accounts[id].pass!==p)return document.getElementById('msg').innerText="Faux";curAcc=id;showProfiles();}
function showProfiles(){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');s.style.display='none'});document.getElementById('profiles').classList.add('active');document.getElementById('profiles').style.display='flex';const acc=accounts[curAcc];document.getElementById('pGrid').innerHTML=acc.profiles.map(pr=>`<div onclick="openProf('${pr.id}')" style="cursor:pointer;text-align:center"><img src="${pr.avatar}" style="width:92px;height:92px;border-radius:16px;object-fit:cover;border:${pr.name==='Madara'?'2px solid #e50914':''}"><div style="font-size:13px;margin-top:6px">${pr.name} ${pr.pin?'🔒':''}</div></div>`).join('')+`<div onclick="showCreateP()" style="cursor:pointer;text-align:center"><div style="width:92px;height:92px;border-radius:16px;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px">+</div><div style="font-size:12px;margin-top:6px">Ajouter</div></div>`;}
function showCreateP(){document.getElementById('createP').classList.add('active');document.getElementById('createP').style.display='flex'}function hideCreateP(){document.getElementById('createP').classList.remove('active');document.getElementById('createP').style.display='none'}
function saveP(){const n=document.getElementById('pName').value.trim();if(!n)return alert('Nom');accounts[curAcc].profiles.push({id:Date.now().toString(),name:n,avatar:"https://i.pravatar.cc/300?img=11",pin:null});localStorage.setItem('mf_v15_all',JSON.stringify(accounts));hideCreateP();showProfiles()}
function showSettings(){const acc=accounts[curAcc];document.getElementById('settingsList').innerHTML=acc.profiles.map(pr=>`<div style="background:#111;padding:12px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between"><div><b>${pr.name}</b><br><span style="font-size:12px;opacity:.6">PIN: ${pr.pin||'Aucun'}</span></div><button onclick="setPin('${pr.id}')" style="background:#e50914;color:#fff;border:none;padding:8px 12px;border-radius:6px">PIN</button></div>`).join('');document.getElementById('settings').classList.add('active');document.getElementById('settings').style.display='flex'}
function hideSettings(){document.getElementById('settings').classList.remove('active');document.getElementById('settings').style.display='none'}
function setPin(id){const code=prompt('4 chiffres (vide pour enlever):');if(code===null)return;if(code===''||/^\d{4}$/.test(code)){accounts[curAcc].profiles.find(p=>p.id===id).pin=code===''?null:code;localStorage.setItem('mf_v15_all',JSON.stringify(accounts));showSettings();showProfiles()}}
function openProf(id){const pr=accounts[curAcc].profiles.find(p=>p.id===id);if(pr.pin){pinTarget=pr;pin="";document.getElementById('pinName').innerText=pr.name;document.getElementById('pinAv').innerHTML=`<img src="${pr.avatar}" style="width:100%;height:100%;object-fit:cover">`;upd();document.getElementById('pinScreen').classList.add('active');document.getElementById('pinScreen').style.display='flex'}else enterApp(pr)}
function tp(n){if(pin.length>=4)return;pin+=n;upd();if(pin.length===4){if(pin===pinTarget.pin){document.getElementById('pinScreen').style.display='none';enterApp(pinTarget)}else{pin="";upd();alert('Faux')}}}function dp(){pin=pin.slice(0,-1);upd()}function upd(){document.querySelectorAll('#dots div').forEach((d,i)=>d.innerText=pin[i]?'•':'')}function backP(){document.getElementById('pinScreen').style.display='none'}
function logout(){document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active')});document.getElementById('auth').style.display='flex';document.getElementById('auth').classList.add('active')}
function enterApp(pr){curProf=pr;loadFavCont();document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active')});document.getElementById('app').style.display='block';document.getElementById('bAv').src=pr.avatar;load()}

async function fetchMulti(u){try{const r=await fetch(u);const j=await r.json();return j.results||[]}catch{return[]}}
async function load(){let res=[];res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}&language=fr-FR`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&language=fr-FR&page=1`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&language=fr-FR&page=2`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/tv/popular?api_key=${TMDB_KEY}&language=fr-FR&page=1`));res=res.concat(await fetchMulti(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=fr-FR&with_genres=16&page=1`));const map=new Map();res.forEach(m=>{if(!map.has(m.id))map.set(m.id,{id:m.id,title:m.title||m.name,poster:m.poster_path?W500+m.poster_path:'',backdrop:m.backdrop_path?ORIG+m.backdrop_path:W500+m.poster_path,overview:m.overview||'',type:m.media_type||'movie'})});ALL=[...map.values()].slice(0,400);render();}

function render(){
if(!ALL.length)return;
document.getElementById('pHero').style.backgroundImage=`url('${ALL[0].backdrop}')`;
const h=ALL[0];
document.getElementById('hero').innerHTML=`<img src="${h.backdrop}"><div class="heroB"><button class="btnW" onclick="playMovie(${h.id},'${h.type}','${h.title.replace(/'/g,"")}')">▶ Regarder</button><button class="btnG" onclick="toggleFav(${h.id})">${favs.includes(h.id)?'♥ Dans Ma Liste':'♡ Ma Liste'}</button></div>`;

let cats=[];
if(cont.length) cats.push(["Reprendre la lecture", ALL.filter(m=>cont.includes(m.id))]);
if(favs.length) cats.push(["Ma Liste", ALL.filter(m=>favs.includes(m.id))]);
cats.push(["Films populaires",ALL.slice(1,15)]);
cats.push(["Séries du moment",ALL.slice(15,30)]);
cats.push(["Anime",ALL.slice(30,45)]);
cats.push(["Top Madara Flix",ALL.slice(45,60)]);

document.getElementById('sections').innerHTML=cats.filter(c=>c[1].length).map(([t,arr])=>`<div class="sec"><div class="secT">${t}</div><div class="row">${arr.map(m=>`<div class="card" onclick="openDetail(${m.id})"><img src="${m.poster}" loading="lazy"><div class="fav" onclick="event.stopPropagation();toggleFav(${m.id})">${favs.includes(m.id)?'♥':'♡'}</div></div>`).join('')}</div></div>`).join('');
}

function doSearch(){
const q=document.getElementById('searchInput').value.toLowerCase().trim();
if(!q){render();return;}
const filtered=ALL.filter(m=>m.title.toLowerCase().includes(q));
document.getElementById('sections').innerHTML=`<div class="sec"><div class="secT">Résultats pour "${q}" (${filtered.length})</div><div class="row" style="flex-wrap:wrap">${filtered.map(m=>`<div class="card" onclick="openDetail(${m.id})"><img src="${m.poster}"></div>`).join('')||'<div style="opacity:.5">Aucun résultat</div>'}</div></div>`;
}
function showHome(){document.getElementById('searchInput').value='';render();window.scrollTo(0,0)}
function showList(){
if(!favs.length) return alert('Ma Liste vide - ajoute des films avec ♥');
const list=ALL.filter(m=>favs.includes(m.id));
document.getElementById('sections').innerHTML=`<div class="sec"><div class="secT">Ma Liste ♥ (${list.length})</div><div class="row" style="flex-wrap:wrap">${list.map(m=>`<div class="card" onclick="openDetail(${m.id})"><img src="${m.poster}"><div class="fav" onclick="event.stopPropagation();toggleFav(${m.id})">♥</div></div>`).join('')}</div></div>`;
}
function toggleFav(id){
if(favs.includes(id)) favs=favs.filter(f=>f!==id); else favs.push(id);
localStorage.setItem(getFavKey(),JSON.stringify(favs));
render();
if(document.getElementById('detail').style.display==='block'){const m=ALL.find(x=>x.id===id); if(m) openDetail(id);}
}

async function openDetail(id){const m=ALL.find(x=>x.id===id);if(!m)return;let seasons=[];try{const tv=await fetch(`https://api.themoviedb.org/3/tv/${m.id}?api_key=${TMDB_KEY}&language=fr-FR`).then(r=>r.json());if(tv?.number_of_seasons){for(let s=1;s<=Math.min(tv.number_of_seasons,8);s++){const sd=await fetch(`https://api.themoviedb.org/3/tv/${m.id}/season/${s}?api_key=${TMDB_KEY}&language=fr-FR`).then(r=>r.json()).catch(()=>null);if(sd?.episodes)seasons.push({num:s,name:sd.name||`Saison ${s}`,eps:sd.episodes})}}}catch{}let html=`<div style="height:62vh;background:url('${m.backdrop}') center/cover;position:relative"><button onclick="document.getElementById('detail').style.display='none'" style="position:absolute;top:14px;left:14px;background:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:800">✕</button><div style="position:absolute;inset:0;background:linear-gradient(to top,#000 40%,transparent)"></div></div><div style="padding:14px"><h2>${m.title}</h2><p style="opacity:.7;font-size:13px;margin-top:6px">${m.overview.slice(0,220)}</p><button class="btnW" style="margin-top:14px" onclick="playMovie(${m.id},'${m.type}','${m.title.replace(/'/g,"")}')">▶ Regarder 0 PUB</button><button class="btnG" onclick="toggleFav(${m.id})">${favs.includes(m.id)?'♥ Retirer de Ma Liste':'♡ Ajouter à Ma Liste'}</button>`;if(seasons.length){html+=`<div style="display:flex;gap:8px;overflow-x:auto;margin-top:14px">`+seasons.map((s,i)=>`<button onclick="showS(${i})" style="background:${i==0?'#fff':'#222'};color:${i==0?'#000':'#fff'};border:none;padding:8px 14px;border-radius:20px;font-weight:700;white-space:nowrap">${s.name}</button>`).join('')+`</div><div id="eps"></div>`}html+=`</div>`;document.getElementById('detail').innerHTML=html;document.getElementById('detail').style.display='block';window._seasons=seasons;window._mid=m.id;window._mtitle=m.title;if(seasons.length)showS(0);}
function showS(idx){const s=window._seasons[idx];document.getElementById('eps').innerHTML=s.eps.map(ep=>`<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #222" onclick="playEpisode(${window._mid},${s.num},${ep.episode_number},'${(window._mtitle+' E'+ep.episode_number).replace(/'/g,"")}')"><div style="opacity:.5;font-weight:800">${ep.episode_number}</div><img src="${ep.still_path?W500+ep.still_path:''}" style="width:110px;height:62px;border-radius:6px;background:#111;object-fit:cover"><div style="flex:1"><div style="font-size:13px;font-weight:700">${ep.name||'Episode '+ep.episode_number}</div></div><div>▶</div></div>`).join('');}

function getUrl(server,type,id,s,e){
  // API PERSO VERCEL - 0 PUB - tu contrôles tout
  // Si ton API existe: /api/stream?type=movie&id=123
  // Sinon fallback Videasy/VidRift 0 redirection
  const isTV = type==='tv' || window._seasons;
  if(server===1){
    if(isTV) return `/api/stream?type=tv&id=${id}&s=${s||1}&e=${e||1}`;
    return `/api/stream?type=movie&id=${id}`;
  } else {
    if(isTV) return `https://player.videasy.net/tv/${id}/${s||1}/${e||1}`;
    return `https://player.videasy.net/movie/${id}`;
  }
}
function playMovie(id,type,title){
  curMovie={id,type,s:1,e:1}; document.getElementById('playingTitle').innerText=title||'';
  if(!cont.includes(id)){cont.unshift(id); cont=cont.slice(0,20); localStorage.setItem(getContKey(),JSON.stringify(cont));}
  document.getElementById('frame').src=getUrl(1,type,id); document.getElementById('player').style.display='flex';
}
function playEpisode(tvId,season,episode,title){
  curMovie={id:tvId,type:'tv',s:season,e:episode}; document.getElementById('playingTitle').innerText=title||'';
  if(!cont.includes(tvId)){cont.unshift(tvId); cont=cont.slice(0,20); localStorage.setItem(getContKey(),JSON.stringify(cont));}
  document.getElementById('frame').src=getUrl(1,'tv',tvId,season,episode); document.getElementById('player').style.display='flex';
}
function switchServer(n){
  if(!curMovie) return;
  document.getElementById('sv1').style.background=n===1?'#fff':'#222';document.getElementById('sv1').style.color=n===1?'#000':'#fff';
  document.getElementById('sv2').style.background=n===2?'#fff':'#222';document.getElementById('sv2').style.color=n===2?'#000':'#fff';
  document.getElementById('frame').src=getUrl(n,curMovie.type,curMovie.id,curMovie.s,curMovie.e);
}
function closePlayer(){document.getElementById('frame').src='';document.getElementById('player').style.display='none';}
setTimeout(()=>{document.getElementById('intro').classList.add('out'); setTimeout(()=>document.getElementById('intro').style.display='none',800)},2600);
</script>
</body>
</html>
